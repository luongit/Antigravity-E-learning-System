<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.15" />
      <circle cx="60" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)" />
  <rect width="1920" height="1080" fill="url(#fade)" />
</svg>
